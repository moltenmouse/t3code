# Builds and publishes an Aiva release of t3: CLI archives for Linux (x64,
# arm64), macOS (Apple silicon) and Windows (x64), SHA256SUMS and the update
# feed files, as a GitHub release v<version>. Mirrors the CLI path of upstream's
# release.yml / release-desktop.yml, without desktop, mobile, npm or a signing
# certificate: the macOS build is signed ad hoc, as upstream's is without one,
# and the Windows one isn't signed. No Intel macOS build: Node can't make t3's
# single executable there (see release.yml). Windows is built on Linux, as
# upstream does (cargo-xwin, and the target's Node for the executable), and
# its archive is smoke-tested on a Windows runner.
name: aiva-release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Aiva revision n, giving v<upstream>-aiva.<n>"
        required: true
        default: "1"
      ref:
        description: "Branch or commit to build (default: aiva)"
        required: false
        default: "aiva"
  push:
    tags:
      - "v*-aiva.*"

permissions:
  contents: write

concurrency:
  group: aiva-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            ref="${GITHUB_REF}"
          else
            base="$(tr -d '[:space:]' < AIVA_BASE)"
            version="${base#v}-aiva.${{ inputs.revision }}"
            ref="${{ inputs.ref }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-aiva\.[0-9]+$ ]]; then
            echo "Bad version: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building t3 $version from $ref"

  bundle:
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"
      - name: Pick bundle script
        id: bundle_build
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"
      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run ${{ steps.bundle_build.outputs.script }}
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI archive (${{ matrix.resource_key }})
    needs: [version, bundle]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - platform: mac
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - platform: win
            arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"
      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - name: Install cargo-xwin
        if: matrix.platform == 'win'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1
      - name: Build resource monitor
        run: cargo ${{ matrix.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
      - name: Stage resource monitor
        run: |
          set -euo pipefail
          exe="t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}"
          dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/$exe" "$dir/$exe"
      # The executable embeds the target's Node: put a checksum-verified copy
      # where tsdown looks, as upstream's release-desktop.yml does.
      - name: Download Windows Node.js for the CLI executable
        if: matrix.platform == 'win'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").engines.node')"
          name="node-v$version-win-x64"
          dir="$RUNNER_TEMP/node-download"
          mkdir -p "$dir"
          fetch=(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 --speed-limit 102400 --speed-time 30)
          "${fetch[@]}" -o "$dir/$name.zip" "https://nodejs.org/dist/v$version/$name.zip"
          "${fetch[@]}" -o "$dir/SHASUMS256.txt" "https://nodejs.org/dist/v$version/SHASUMS256.txt"
          (cd "$dir" && grep " $name.zip\$" SHASUMS256.txt | sha256sum -c -)
          dest="${XDG_CACHE_HOME:-$HOME/.cache}/tsdown/node/v$version/win-x64"
          mkdir -p "$dest"
          unzip -p "$dir/$name.zip" "$name/node.exe" > "$dest/node.exe"
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }
      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client
      - name: Build CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose ${{ matrix.platform == 'win' && '--target win-x64' || '' }}
      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform ${{ matrix.platform }} \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.version.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
      # The Windows archive can't run here; cli-smoke-windows runs it.
      - name: Smoke-test CLI archive
        if: matrix.platform != 'win'
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.version.outputs.version }}"
      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.resource_key }}
          path: release-cli/*
          if-no-files-found: error
          retention-days: 7

  cli-smoke-windows:
    name: Smoke-test the Windows CLI archive
    needs: [version, cli]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-win32-x64
          path: dist
      - name: Unpack it and run t3.exe
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $stem = "t3-$version-win32-x64"
          Expand-Archive "dist/$stem.zip" -DestinationPath smoke
          foreach ($file in @("t3.exe", "resource-monitor/win32-x64/t3-resource-monitor.exe", "client/index.html")) {
            if (-not (Test-Path "smoke/$stem/$file")) { throw "$stem.zip has no $file" }
          }
          $said = & "smoke/$stem/t3.exe" --version
          if ($LASTEXITCODE -ne 0 -or "$said" -notmatch [regex]::Escape($version)) { throw "t3.exe --version said: $said" }
          "t3.exe --version: $said"

  release:
    name: Publish GitHub release
    needs: [version, cli, cli-smoke-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Checksums and update feed files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          version="${{ needs.version.outputs.version }}"
          ls -la
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # t3's feed file for Windows is latest.yml.
          for pair in "linux-x64:latest-linux.yml" "linux-arm64:latest-linux-arm64.yml" "darwin-arm64:latest-mac.yml" "win32-x64:latest.yml"; do
            key="${pair%%:*}"; feed="${pair#*:}"
            ext="tar.gz"; [[ "$key" == win32-* ]] && ext="zip"
            archive="t3-${version}-${key}.${ext}"
            [ -f "$archive" ] || { echo "missing $archive" >&2; exit 1; }
            printf 'version: %s\npath: %s\nsha256: %s\nreleaseDate: %s\n' \
              "$version" "$archive" "$(sha256sum "$archive" | cut -d' ' -f1)" "$date" > "$feed"
          done
          cat SHA256SUMS latest-linux.yml
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2; exit 1
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.ref == 'aiva' && 'aiva' || github.sha }}" \
            --title "t3 ${version} (Aiva)" \
            --notes "Upstream $(echo "$version" | sed 's/-aiva\..*//') plus the patches in AIVA_PATCHES.md." \
            --latest
